<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker||</title>
  <link rel="stylesheet" href="./asset/styles/styles.css">
</head>

<body>
  <main>
    <section id="expense-form-section">
      <h2>Add / Edit Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label for="expense-description">Description:</label>
          <input type="text" id="expense-description" required>
        </div>
        <div class="form-group">
          <label for="expense-amount">Amount:</label>
          <input type="number" id="expense-amount" required>
        </div>
        <div class="form-group">
          <label for="expense-category">Category:</label>
          <select id="expense-category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="expense-date">Date:</label>
          <input type="date" id="expense-date" required>
        </div>
        <button type="submit" id="add-expense-btn">Add Expense</button>
      </form>
    </section>

    <section id="filter-section">
      <h2>Filter Expenses</h2>
      <div class="filter-group">
        <label for="filter-category">Category:</label>
        <select id="filter-category">
          <option value="">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-start-date">Start Date:</label>
        <input type="date" id="filter-start-date">
      </div>
      <div class="filter-group">
        <label for="filter-end-date">End Date:</label>
        <input type="date" id="filter-end-date">
      </div>
      <button id="filter-btn">Apply Filters</button>
      <button id="reset-filter-btn">Reset Filters</button>
    </section>

    <section id="expense-list-section">
      <h2>Expense List</h2>
      <table id="expense-table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>

</html>
